<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashok Dairy — Counter</title>
<meta name="theme-color" content="#7A2A2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ashok Dairy">
<style>
:root{
  --cream:#FBF6ED; --card:#FFFDF8; --line:#E4D6BE; --ink:#2B211B;
  --maroon:#7A2A2A; --maroon-d:#5C1F1F; --gold:#E7A33E; --green:#55735A; --green-d:#3F5C45; --red:#B0453D;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
a{color:var(--maroon)}a:hover{color:var(--maroon-d)}

/* ---------- shell: phone default, widens with breakpoints ---------- */
#app{height:100dvh;min-height:100vh;display:grid;grid-template-areas:"head" "main" "nav";grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:1fr;position:relative;overflow:hidden}

header.bar{grid-area:head;background:linear-gradient(175deg,var(--maroon) 0%,var(--maroon-d) 100%);color:var(--cream);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--maroon-d);display:flex;align-items:center;justify-content:center;font:700 16px/1 var(--serif);border:2px solid var(--cream);flex:none}
.shop{flex:1;min-width:0}
.shop b{display:block;font:600 19px/1.15 var(--serif)}
.shop span{display:block;font:400 11.5px/1.3 var(--sans);color:rgba(251,246,237,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today{text-align:right;flex:none}
.today i{display:block;font:400 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(251,246,237,.55);font-style:normal}
.today b{display:block;font:700 15px/1.4 var(--mono);color:var(--gold)}

main{grid-area:main;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cats{flex:none;display:flex;gap:8px;padding:12px 16px 10px;overflow-x:auto}
.chip{flex:none;border-radius:999px;padding:9px 15px;font:600 12.5px/1 var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--card);color:rgba(43,33,27,.65)}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--cream)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 16px 24px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left}
.tile .thumb{position:relative;height:66px;border-radius:11px;overflow:hidden;display:flex;align-items:flex-start;padding:6px 7px}
.tile .thumb span{font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(43,33,27,.42)}
.tile .nm{font:600 13.5px/1.25 var(--sans);text-wrap:pretty}
.tile .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto}
.tile .pr b{font:700 14px/1 var(--mono);color:var(--maroon-d)}
.tile .pr i{font:400 10.5px/1 var(--sans);color:rgba(43,33,27,.5);font-style:normal}
.badge{position:absolute;top:-7px;right:-6px;background:var(--gold);color:var(--maroon-d);font:700 11px/1 var(--mono);padding:5px 8px;border-radius:999px;border:2px solid var(--cream);white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat i{display:block;font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(43,33,27,.5);font-style:normal}
.stat b{display:block;font:700 18px/1.4 var(--mono);color:var(--maroon-d)}
.stat.due b{color:var(--red)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;font:400 12.5px/1.5 var(--sans);color:rgba(43,33,27,.45)}
.rowcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer}
.rowcard .id{font:700 13px/1.3 var(--mono)}
.rowcard .meta{font:400 11px/1.4 var(--sans);color:rgba(43,33,27,.5)}
.tag{font:700 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.amt{font:700 14px/1 var(--mono);color:var(--maroon-d)}

.itemlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item .sw{width:70px;height:70px;border-radius:12px;flex:none}
.item .nm{font:600 13.5px/1.3 var(--sans)}
.item .sub{font:400 11px/1.4 var(--sans);color:rgba(43,33,27,.5)}
.stepper{display:flex;align-items:center;gap:2px;flex:none;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:3px 4px}
.stepper button{width:28px;height:28px;border:none;background:transparent;color:var(--maroon);font:700 17px/1 var(--sans);cursor:pointer}
.stepper span{min-width:52px;text-align:center;font:700 13px/1 var(--mono);color:var(--maroon-d)}

nav{grid-area:nav;background:rgba(251,246,237,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 24px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-between;gap:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:transparent;cursor:pointer;font:600 10.5px/1 var(--sans);color:rgba(43,33,27,.45);padding:6px 2px;border-radius:12px}
nav button i{width:22px;height:22px;border-radius:7px;background:#DCCFB8;display:block}
nav button[aria-pressed="true"]{color:var(--maroon)}
nav button[aria-pressed="true"] i{background:var(--maroon)}
nav .railtotal{display:none}

/* pay bar (narrow only) */
#paybar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream);border-radius:16px;padding:11px 12px 11px 16px;box-shadow:0 12px 28px rgba(43,33,27,.28)}
#paybar .c{flex:1;min-width:0}
#paybar .c i{display:block;font:400 10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(251,246,237,.55);font-style:normal}
#paybar .c b{display:block;font:700 17px/1.3 var(--mono);color:var(--gold)}
#paybar button{flex:none;border:none;border-radius:11px;padding:12px 18px;background:var(--gold);color:var(--maroon-d);font:700 13.5px/1 var(--sans);cursor:pointer}

/* ticket: bottom sheet when narrow, column when wide */
#ticketwrap:empty{display:none}
#ticketwrap{position:absolute;inset:0;z-index:60;background:rgba(43,33,27,.42);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .15s ease}
#ticket{background:var(--cream);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);max-height:86%;display:flex;flex-direction:column;animation:sheetUp .22s cubic-bezier(.32,.72,0,1)}
.handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px;flex:none}
#ticket h2{margin:0 0 2px;font:600 18px/1.25 var(--serif);flex:none}
#ticket .sub{font:400 11.5px/1.4 var(--sans);color:rgba(43,33,27,.5);margin-bottom:12px;flex:none}
.lines{flex:1;min-height:0;overflow-y:auto}
.line{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .who{flex:1;min-width:0}
.line .nm{font:600 13.5px/1.3 var(--sans)}
.line .meta{font:400 11px/1.4 var(--sans);color:rgba(43,33,27,.5)}
.qbox{display:flex;align-items:center;gap:1px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 3px}
.qbox button{width:26px;height:28px;border:none;background:transparent;color:var(--maroon);font:700 17px/1 var(--sans);cursor:pointer}
.qbox input{width:50px;text-align:center;border:none;outline:none;background:transparent;font:700 13px/1 var(--mono);color:var(--ink);padding:6px 0}
.qbox .u{font:700 10.5px/1 var(--mono);color:rgba(43,33,27,.45);padding-right:4px}
.line .lt{width:62px;text-align:right;font:700 13px/1 var(--mono);color:var(--maroon-d)}
.del{flex:none;width:30px;height:30px;border:none;border-radius:9px;background:#F7E6E4;color:var(--red);font:700 15px/1 var(--sans);cursor:pointer}
.totrow{flex:none;display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.totrow span{font:600 14px/1 var(--sans)}
.totrow b{font:700 18px/1.2 var(--mono);color:var(--maroon-d)}
.pay3{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.pay3 button{border:none;border-radius:13px;padding:15px 6px;font:700 13.5px/1 var(--sans);cursor:pointer}
.pcash{background:var(--green);color:#fff}
.pqr{background:var(--maroon);color:var(--cream)}
.pcredit{background:var(--card);color:var(--maroon-d);border:1.5px solid var(--line)!important}
.panel{flex:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.keys button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 0;font:700 19px/1 var(--mono);color:var(--ink);cursor:pointer}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px 4px;font:700 12.5px/1 var(--mono);color:var(--maroon-d);cursor:pointer}
.note{border-radius:12px;padding:11px 14px;font:700 14px/1 var(--sans);display:flex;justify-content:space-between;margin-bottom:12px}
.note b{font:700 18px/1.2 var(--mono)}
.ok{background:#EAF1EA;color:var(--green-d)}
.bad{background:#F7E6E4;color:var(--red)}
.wide-btn{width:100%;border:none;border-radius:13px;padding:16px;font:700 14.5px/1 var(--sans);cursor:pointer;background:var(--green);color:#fff}
.wide-btn[disabled]{background:#CBD5CB;cursor:not-allowed}
.ghost{display:block;margin:8px auto 0;border:1.5px solid var(--gold);background:#FDF3E1;color:#8A5A12;font:700 11.5px/1 var(--sans);border-radius:9px;padding:9px 14px;cursor:pointer}
.qr{margin:10px auto 8px;width:190px;height:190px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(45deg,#F1EADD 0 6px,#fff 6px 12px)}
.qr span{font:700 10px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(43,33,27,.45);text-align:center}
.person{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px;cursor:pointer;text-align:left}
.person .av{width:34px;height:34px;border-radius:50%;background:#F3EBD9;color:var(--maroon);display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--serif);flex:none}
.person .nm{flex:1;font:600 13.5px/1.3 var(--sans)}
.person .due{font:700 12.5px/1 var(--mono);color:var(--red)}
.last{background:#F3EBD9;border-radius:12px;padding:11px 14px;margin-bottom:12px;flex:none}
.last .hd{font:700 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--maroon);margin-bottom:7px}
.last .r{display:flex;justify-content:space-between;gap:10px;font:400 11.5px/1.6 var(--mono);color:rgba(43,33,27,.6)}
.last .r.tot{font:700 12.5px/1.7 var(--mono);color:var(--maroon-d)}
.last hr{border:none;border-top:1px dashed rgba(43,33,27,.2);margin:6px 0 4px}
.last .view{width:100%;margin-top:9px;border:1px solid var(--line);background:var(--card);color:var(--maroon-d);border-radius:10px;padding:11px 6px;font:600 12.5px/1 var(--sans);cursor:pointer}

/* modals */
.modal{position:absolute;inset:0;z-index:70;background:rgba(43,33,27,.45);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .15s ease}
.sheet{background:var(--cream);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 28px);animation:sheetUp .22s cubic-bezier(.32,.72,0,1)}
.sheet h3{margin:0;font:600 18px/1.25 var(--serif)}
.sheet .sub{font:400 12px/1.4 var(--sans);color:rgba(43,33,27,.55);margin:2px 0 14px}
.chips3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.chips3 button{border:1.5px solid var(--line);background:var(--card);color:var(--maroon-d);border-radius:13px;padding:15px 6px;font:700 15px/1 var(--mono);cursor:pointer}
.rs{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:4px 4px 4px 14px}
.rs i{font:700 14px/1 var(--mono);color:rgba(43,33,27,.45);font-style:normal}
.rs input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:700 20px/1 var(--mono);color:var(--ink);padding:12px 0}
.rs button{flex:none;border:none;border-radius:10px;padding:13px 18px;font:700 13.5px/1 var(--sans);background:var(--maroon);color:var(--cream);cursor:pointer}
.rs button[disabled]{background:#DCCFB8;cursor:not-allowed}
.hint{font:400 12px/1.5 var(--sans);color:var(--maroon-d);margin-top:9px;min-height:18px}

#receiptwrap{position:absolute;inset:0;z-index:80;background:rgba(43,33,27,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.slip{background:#fff;border-radius:6px;padding:20px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--ink);width:100%;max-width:360px;max-height:68%;overflow-y:auto;box-shadow:0 22px 50px rgba(0,0,0,.3)}
.slip .t{text-align:center;font:700 15px/1.3 var(--serif)}
.slip .c{text-align:center;color:rgba(43,33,27,.6)}
.slip .l{display:flex;justify-content:space-between;gap:10px}
.slip hr{border:none;border-top:1px dashed #C9BCA6;margin:9px 0}
.slipbtns{display:flex;gap:9px;margin-top:14px;width:100%;max-width:360px}
.slipbtns button{border:1px solid rgba(251,246,237,.4);background:rgba(251,246,237,.12);color:var(--cream);border-radius:13px;padding:15px 12px;font:600 13px/1 var(--sans);cursor:pointer}
.slipbtns .paper{flex:none;font-family:var(--mono);font-weight:700;font-size:12px}
.slipbtns .done{flex:1}
.slipbtns .print{flex:1;border:none;background:var(--gold);color:var(--maroon-d);font-weight:700}

#toast{position:absolute;left:0;right:0;bottom:130px;z-index:90;display:flex;justify-content:center;pointer-events:none;animation:fadeIn .18s ease}
#toast div{background:var(--ink);color:var(--cream);border-radius:14px;padding:14px 22px;font:700 14px/1 var(--sans);box-shadow:0 14px 30px rgba(43,33,27,.3)}

@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- TABLET: left rail replaces bottom nav ---------- */
@media (min-width:700px){
  #app{grid-template-areas:"nav head" "nav main";grid-template-rows:auto minmax(0,1fr);grid-template-columns:96px minmax(0,1fr)}
  header.bar{padding:18px 26px;background:none;color:var(--ink)}
  .shop b{font-size:22px}
  .shop span{color:rgba(43,33,27,.5)}
  .today{display:none}
  nav{flex-direction:column;justify-content:flex-start;gap:8px;background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-d) 100%);border-top:none;padding:20px 10px calc(env(safe-area-inset-bottom) + 18px);align-items:center}
  nav::before{content:"AD";width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--maroon-d);display:flex;align-items:center;justify-content:center;font:700 17px/1 var(--serif);border:2px solid var(--cream);flex:none;margin-bottom:14px}
  nav button{flex:none;width:100%;border-radius:12px;padding:11px 4px;background:rgba(255,255,255,.08);color:rgba(251,246,237,.75)}
  nav button i{background:rgba(251,246,237,.45)}
  nav button[aria-pressed="true"]{background:var(--gold);color:var(--maroon-d)}
  nav button[aria-pressed="true"] i{background:var(--maroon-d)}
  nav .railtotal{display:block;margin-top:auto;text-align:center}
  nav .railtotal i{display:block;width:auto;height:auto;background:none;font:400 9px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(251,246,237,.5);font-style:normal}
  nav .railtotal b{display:block;font:700 13px/1.5 var(--mono);color:var(--gold)}
  .cats{padding:0 26px 14px;flex-wrap:wrap;overflow:visible}
  .scroll{padding:0 26px 26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:14px}
  .tile .thumb{height:80px}
  #paybar{left:auto;right:26px;bottom:26px;width:min(420px,60vw)}
  .sheet,#ticket{border-radius:22px;max-width:520px;width:100%;margin:0 auto 26px;padding-bottom:24px}
  .modal,#ticketwrap{justify-content:center;align-items:center;padding:26px}
  .sheet{animation:fadeIn .16s ease}
  #ticket{animation:fadeIn .16s ease;max-height:88%}
  .handle{display:none}
}

/* ---------- DESKTOP: ticket lives permanently beside the grid ---------- */
@media (min-width:1080px){
  #app{grid-template-areas:"nav head ticket" "nav main ticket";grid-template-columns:96px minmax(0,1fr) 392px}
  #ticketwrap{position:static;grid-area:ticket;inset:auto;background:none;display:block;padding:0;animation:none;z-index:1}
  #ticket{grid-area:ticket;height:100%;max-height:none;width:auto;max-width:none;margin:0;border-radius:0;border-left:1px solid var(--line);background:var(--card);padding:22px 20px 20px;animation:none}
  #ticketwrap.hidden{display:block}
  #paybar{display:none!important}
  .line{flex-wrap:wrap;row-gap:8px}
  .line .who{flex:1 1 100%;order:0}
  .line .qbox{order:1}
  .line .lt{order:2;flex:1;width:auto;text-align:right}
  .line .del{order:3}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .itemlist{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
}
@media (min-width:1500px){
  #app{grid-template-columns:112px minmax(0,1fr) 440px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="logo">AD</div>
    <div class="shop">
      <b>Ashok Dairy Pvt. Ltd.</b>
      <span>Bhagwati Marg, Naxal, Kathmandu · 01-4513225</span>
    </div>
    <div class="today"><i>Today</i><b id="todayTotalM">Rs. 0</b></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <aside id="ticketwrap" data-a="close"></aside>
  <div id="layers"></div>
</div>

<script>
(function(){
"use strict";

var PRODUCTS = [
  {id:'p1', name:'Cow Milk (दूध)', unit:'litre', price:120, category:'Milk', tone:'#EAF1F4'},
  {id:'p2', name:'Buffalo Milk (दूध)', unit:'litre', price:140, category:'Milk', tone:'#EFF3F0'},
  {id:'p14', name:'Milk Packet (दूध)', unit:'packet', price:50, category:'Milk', tone:'#EDF2F5'},
  {id:'p9', name:'Mohi (मोही)', unit:'litre', price:80, category:'Mohi', tone:'#F1F4EE'},
  {id:'p4a', name:'Sweet Yoghurt (गुलियो दही) 1000 ml', unit:'cup', price:190, category:'Yoghurt', tone:'#F7EDDD'},
  {id:'p4b', name:'Unsweet Yoghurt (सादा दही) 1000 ml', unit:'cup', price:170, category:'Yoghurt', tone:'#F3F1E7'},

/* ---------- helpers ---------- */
function prod(id){ for(var i=0;i<PRODUCTS.length;i++) if(PRODUCTS[i].id===id) return PRODUCTS[i]; return null; }
function fmt(n){ return 'Rs. ' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function fmtShort(n){ return fmt(n).replace('Rs. ','Rs '); }
function priceOf(p){ return S.prices[p.id] != null ? S.prices[p.id] : p.price; }
function kind(u){ var s=(u||'').toLowerCase(); return s==='kg' ? 'kg' : s==='litre' ? 'litre' : null; }
function step(u){ var k=kind(u); return k==='kg' ? 0.05 : k==='litre' ? 0.5 : 1; }
function trim(n){ return Number.isInteger(n) ? n : parseFloat(n.toFixed(2)); }
function qtyText(unit,q){
  var k = kind(unit);
  if(k==='kg'){
    if(q < 1){ var g=q*1000; return (Number.isInteger(g)?g:g.toFixed(1)) + ' g'; }
    return (Number.isInteger(q) ? q : q.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')) + ' kg';
  }
  if(k==='litre') return q < 1 ? Math.round(q*1000)+' ml' : trim(q)+' L';
  return trim(q) + '';
}
function unitShort(u){ var k=kind(u); return k==='kg' ? 'kg' : k==='litre' ? 'L' : 'pcs'; }
function entries(){
  var out=[];
  for(var id in S.cart){ if(S.cart[id] > 0){ var p=prod(id); if(p) out.push({id:p.id,name:p.name,unit:p.unit,tone:p.tone,price:priceOf(p),qty:S.cart[id]}); } }
  return out;
}
function total(){ return entries().reduce(function(s,e){ return s + e.price*e.qty; }, 0); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function isWideStatic(){ return window.matchMedia('(min-width:1080px)').matches; }

function save(){
  try{
    localStorage.setItem('adr:state', JSON.stringify({
      sales: S.sales.slice(0,400).map(function(x){ return Object.assign({}, x, {time:new Date(x.time).toISOString()}); }),
      counter:S.counter, prices:S.prices, credit:S.credit, paper:S.paper
    }));
  }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem('adr:state'); if(!raw) return;
    var d = JSON.parse(raw);
    S.sales = (d.sales||[]).map(function(s){ return Object.assign({}, s, {time:new Date(s.time)}); });
    S.counter = d.counter||0; S.prices = d.prices||{}; S.credit = d.credit||S.credit;
    if(d.paper===58||d.paper===80) S.paper = d.paper;
    if(S.sales.length) S.last = S.sales[0];
  }catch(e){}
}

/* ---------- actions ---------- */
function bump(id,delta){
  var p = prod(id);
  var next = Math.round((((S.cart[id]||0) + delta*step(p.unit)))*1000)/1000;
  if(next <= 0.001) delete S.cart[id]; else S.cart[id] = next;
  delete S.draft[id];
  render();
}
function addQty(id,v){ S.cart[id] = Math.round(((S.cart[id]||0)+v)*1000)/1000; S.sheet=null; S.qtyId=null; render(); }
function finalize(method,label){
  var items = entries(), n = S.counter+1;
  var sale = {
    id:'AD-'+String(n).padStart(4,'0'), time:new Date(),
    items: items.map(function(e){ return {name:e.name,unit:e.unit,price:e.price,qty:e.qty}; }),
    total: total(), method:method, methodLabel:label
  };
  if(method==='cash'){ sale.received = Number(S.cash||0); sale.change = sale.received - sale.total; }
  S.sales = [sale].concat(S.sales); S.counter = n;
  S.cart = {}; S.draft = {}; S.cash = ''; S.pay = null; S.ticketOpen = false;
  S.receipt = sale; S.last = sale; S.sheet = null; S.toast = true;
  save(); render();
  clearTimeout(finalize._t);
  finalize._t = setTimeout(function(){ S.toast=false; render(); }, 1900);
}
function printReceipt(){
  var sale = S.receipt; if(!sale) return;
  var paper = S.paper||80;
  function line(l,r,b){ return '<div class="l"'+(b?' style="font-weight:700;font-size:13px"':'')+'><span>'+esc(l)+'</span><span>'+esc(r)+'</span></div>'; }
  var items = sale.items.map(function(it,i){
    return line((i+1)+'. '+it.name+' × '+qtyText(it.unit,it.qty)+(kind(it.unit)?'':' pcs'), fmt(it.price*it.qty));
  }).join('');
  var html = '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(sale.id)+'</title><style>'
    + '@page{size:'+paper+'mm auto;margin:'+(paper>=80?4:3)+'mm}'
    + 'body{margin:0;font-family:"Courier New",monospace;font-size:'+(paper>=80?11.5:10)+'px;line-height:1.55;color:#000;width:'+(paper>=80?72:48)+'mm}'
    + '.c{text-align:center}.t{text-align:center;font-size:15px;font-weight:700;letter-spacing:.5px}'
    + '.l{display:flex;justify-content:space-between;gap:8px}'
    + 'hr{border:none;border-top:1px dashed #000;margin:6px 0}'
    + '</style></head><body>'
    + '<div class="t">Ashok Dairy Pvt. Ltd.</div>'
    + '<div class="c">Bhagwati Marg, Naxal, Kathmandu, Nepal</div>'
    + '<div class="c">Phone no: 01-4513225</div><div class="c">PAN no: 302380442</div>'
    + '<div style="text-align:right;margin-top:3px">Cashier: Bhisma</div><hr>'
    + '<div class="l"><span>Customer name</span><span style="flex:1;border-bottom:1px dotted #000;margin-left:6px">&nbsp;</span></div>'
    + line('Receipt no.', sale.id)
    + line('Date', new Date(sale.time).toLocaleDateString()+' '+new Date(sale.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))
    + '<hr>' + items + '<hr>'
    + line('Total', fmt(sale.total), true)
    + (sale.method==='cash' && sale.received != null
        ? line('Cash', fmt(sale.received)) + line('Change', fmt(sale.change))
        : line(sale.methodLabel, fmt(sale.total)))
    + '<hr><div class="c" style="font-size:10px">Dherai Dherai Dhanyabad!</div>'
    + '<div class="c" style="font-size:9px;margin-top:5px">All sales are final. We do not accept returns or exchanges.</div>'
    + '</body></html>';
  S.printed = true; render();
  clearTimeout(printReceipt._t);
  printReceipt._t = setTimeout(function(){ S.printed=false; render(); }, 2400);
  var topLevel = false; try{ topLevel = window.self === window.top; }catch(e){ topLevel = false; }
  if(!topLevel) return;
  var f = document.createElement('iframe');
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  f.onload = function(){
    try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){}
    setTimeout(function(){ f.remove(); }, 1500);
  };
  f.srcdoc = html;
}

    + '<div style="text-align:right;color:rgba(43,33,27,.6)">Cashier: Bhisma</div><hr>'
    + '<div class="l"><span>Customer name</span><span style="flex:1;border-bottom:1px dotted #C9BCA6">&nbsp;</span></div>'
    + '<div class="l"><span>Receipt no.</span><span>'+esc(r.id)+'</span></div>'
    + '<div class="l"><span>Date</span><span>'+esc(new Date(r.time).toLocaleDateString()+' '+new Date(r.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))+'</span></div>'
    + '<hr>'+lines+'<hr>'
    + '<div class="l" style="font-weight:700;font-size:13px"><span>Total</span><span>'+esc(fmt(r.total))+'</span></div>'
    + (r.method==='cash' && r.received!=null
        ? '<div class="l"><span>Cash</span><span>'+esc(fmt(r.received))+'</span></div><div class="l"><span>Change</span><span>'+esc(fmt(r.change))+'</span></div>'
        : '<div class="l"><span>'+esc(r.methodLabel)+'</span><span>'+esc(fmt(r.total))+'</span></div>')
    + '<hr><div class="c" style="font-size:10px">Dherai Dherai Dhanyabad!</div>'
    + '<div class="c" style="font-size:9px;margin-top:5px">All sales are final. We do not accept returns or exchanges.</div>'
    + '</div><div class="slipbtns">'
    + '<button class="done" data-a="close">Done</button>'
    + '<button class="print" data-a="print">'+(S.printed?'Sent to printer ✓':'Print')+'</button></div></div>';
}

/* ---------- render ---------- */
function render(){
  var main = document.getElementById('main');
  main.innerHTML = S.tab==='sell' ? sellHTML() : S.tab==='sales' ? salesHTML() : itemsHTML();
  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('todayTotalM').textContent = fmt(S.sales.reduce(function(a,x){return a+x.total;},0));

  var rows = entries(), wide = isWideStatic();
  document.getElementById('ticketwrap').innerHTML = (wide || S.ticketOpen)
    ? '<div id="ticket" data-stop="1">'+ticketHTML()+'</div>' : '';
  var layers = '';
  if(!wide && rows.length && !S.ticketOpen && S.tab==='sell'){
    layers += '<div id="paybar"><div class="c"><i>'+rows.length+(rows.length===1?' item':' items')+'</i><b>'+esc(fmt(total()))+'</b></div>'
      + '<button data-a="opencart">Review &amp; pay</button></div>';
  }
  if(!wide && S.last && !rows.length && S.tab==='sell'){
    var host = main.querySelector('.scroll');
    if(host) host.insertAdjacentHTML('afterbegin', lastHTML());
  }
  if(S.sheet==='qty') layers += qtySheetHTML();
  if(S.sheet==='receipt') layers += receiptHTML();
  if(S.toast) layers += '<div id="toast"><div>Transaction complete</div></div>';
  document.getElementById('layers').innerHTML = layers;

  if(focusKey){
    var el = document.querySelector(focusKey==='amt' ? '[data-amt]' : '[data-q="'+focusKey+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
  }
}

/* ---------- events ---------- */
var focusKey = null;

document.addEventListener('click', function(ev){
  var btn = ev.target.closest('[data-a]');
  if(!btn) return;
  var a = btn.getAttribute('data-a'), v = btn.getAttribute('data-v');
  // backdrops carry data-a="close"; only a click on the backdrop itself dismisses
  if(btn.matches('.modal, #ticketwrap') && ev.target !== btn) return;
  focusKey = null;
  switch(a){
    case 'tab': S.tab = v; S.sheet = null; break;
    case 'cat': S.cat = v; break;
    case 'pick': {
      var p = prod(v);
      if(p.choose || kind(p.unit)){ S.sheet='qty'; S.qtyId=p.id; S.amountStr=''; }
      else bump(p.id, 1);
      break;
    }
    case 'addqty': addQty(v, parseFloat(btn.getAttribute('data-n'))); return;
    case 'byamount': {
      var pp = prod(S.qtyId), rs = Number(S.amountStr||0);
      if(pp && rs){ S.cart[pp.id] = (S.cart[pp.id]||0) + rs/priceOf(pp); delete S.draft[pp.id]; }
      S.sheet=null; S.qtyId=null; S.amountStr='';
      break;
    }
    case 'bump': bump(v, Number(btn.getAttribute('data-d'))); return;
    case 'remove': delete S.cart[v]; delete S.draft[v]; break;
    case 'price': {
      var pr = prod(v), d = Number(btn.getAttribute('data-d'));
      S.prices[pr.id] = Math.max(0, priceOf(pr) + d*5); save();
      break;
    }
    case 'opencart': S.ticketOpen = true; break;
    case 'pay': S.pay = v; S.cash = ''; break;
    case 'backitems': S.pay = null; S.ticketOpen = isWideStatic(); break;
    case 'cashset': S.cash = String(v); break;
    case 'key': S.cash = v==='⌫' ? S.cash.slice(0,-1) : (S.cash + v).slice(0,7); break;
    case 'takecash': finalize('cash','Cash'); return;
    case 'tookqr': finalize('qr','QR / Phone Pay'); return;
    case 'credit': {
      var k = S.credit[Number(v)];
      S.credit[Number(v)] = {name:k.name, due:k.due + total()};
      save(); finalize('credit','Credit — '+k.name); return;
    }
    case 'viewbill': {
      for(var i=0;i<S.sales.length;i++) if(S.sales[i].id===v) S.receipt = S.sales[i];
      S.sheet = 'receipt';
      break;
    }
    case 'viewlast': S.receipt = S.last; S.sheet = 'receipt'; break;
    case 'print': printReceipt(); return;
    case 'close': S.sheet = null; S.qtyId = null; S.amountStr = ''; if(!isWideStatic()) S.ticketOpen = false; break;
    default: return;
  }
  render();
});

document.addEventListener('input', function(ev){
  var q = ev.target.getAttribute && ev.target.getAttribute('data-q');
  if(q){
    var txt = ev.target.value.replace(/[^0-9.]/g,'').slice(0,7);
    S.draft[q] = txt;
    var n = parseFloat(txt);
    if(!isNaN(n) && n > 0) S.cart[q] = n;
    focusKey = q; render(); return;
  }
  if(ev.target.getAttribute && ev.target.getAttribute('data-amt')){
    S.amountStr = ev.target.value.replace(/[^0-9]/g,'').slice(0,6);
    focusKey = 'amt'; render();
  }
});

document.addEventListener('blur', function(ev){
  var q = ev.target.getAttribute && ev.target.getAttribute('data-q');
  if(!q) return;
  focusKey = null;
  if(S.draft[q] != null){
    var n = parseFloat(S.draft[q]);
    if(!isNaN(n) && n > 0) S.cart[q] = n;
    delete S.draft[q];
    render();
  }
}, true);

var lastWide = isWideStatic();
window.addEventListener('resize', function(){
  var w = isWideStatic();
  if(w !== lastWide){ lastWide = w; if(w) S.ticketOpen = false; render(); }
});

load();
render();
})();
</script>
</body>
</html>
